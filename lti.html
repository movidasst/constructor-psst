<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://edeydaueyxilutczhazm.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Constructor de PSST · Taller Moodle</title>
  <link rel="stylesheet" href="assets/lti.css">
  <script src="assets/lti.mjs" type="module"></script>
</head>
<body>
  <main>
    <p class="brand">La Movida de SST+</p>
    <h1>Constructor de PSST</h1>
    <p id="status" role="status" aria-live="polite">Verificando el acceso desde Moodle…</p>
    <form id="draft" hidden>
      <h2 id="workspace"></h2>
      <label>Centro de trabajo<input name="alcance.centro" maxlength="200"></label>
      <label>Área y alcance<input name="alcance.area" maxlength="300"></label>
      <label>Proceso piloto<input name="flujo.proceso" maxlength="200"></label>
      <label>Referencia al mapa y flujo<input name="flujo.referencia" maxlength="500"></label>
      <label>Etapa de la tarea<input name="tarea.etapa" maxlength="200"></label>
      <label>Descripción de la tarea<textarea name="tarea.descripcion" maxlength="6000"></textarea></label>
      <label>Aportes de la mesa de trabajo<textarea name="mesa.aportes" maxlength="6000"></textarea></label>
      <label>Referencia al registro de participación<input name="mesa.referencia" maxlength="500"></label>
      <label>Referencia a la bitácora<input name="bitacora.referencia" maxlength="500"></label>
      <label>Horas de trabajo documentadas<input name="bitacora.horas" type="number" min="0" step="any"></label>
      <div class="actions">
        <button type="submit">Guardar borrador</button>
        <button type="button" id="deliver">Entregar para revisión</button>
      </div>
    </form>
    <p><a href="https://movidasst.org/course/view.php?id=154">Volver al curso en Moodle</a></p>
  </main>
</body>
</html>
